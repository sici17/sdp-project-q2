server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # Four 5 MiB attachments are disallowed by the gateway's 10 MiB aggregate
  # limit. Base64 expansion still requires more than 10 MiB on the wire.
  client_max_body_size 16m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # style-src carries 'unsafe-inline' because Material UI styles components
  # through Emotion, which injects a <style> element per rule at runtime. There
  # is no nonce to hand out from a static file server, so the alternative is
  # build-time extraction with @mui/material-pigment-css.
  #
  # script-src is deliberately NOT relaxed: script injection is the one this
  # policy is really defending against, and it remains 'self'.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

  # nginx 1.30's bundled mime.types does not know ESM's .mjs extension.
  # PDF.js runs its parser in a module worker, and browsers refuse that worker
  # when it is served as application/octet-stream.
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 65s;
  }

  location /manuals/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self';" always;
  }

  location = /metrics {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
