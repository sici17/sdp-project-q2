<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b3261e" />
    <title>AROL Q2 Service Assist Offline</title>
    <style>
      :root {
        color: #17202a;
        background: #f5f7f8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(11, 31, 58, 0.04) 1px, transparent 1px),
          linear-gradient(180deg, rgba(11, 31, 58, 0.04) 1px, transparent 1px),
          #f5f7f8;
        background-size: 28px 28px;
      }

      main {
        width: min(460px, calc(100% - 32px));
        border: 1px solid #d7dde2;
        border-radius: 8px;
        padding: 24px;
        background: #ffffff;
        box-shadow: 0 18px 38px rgba(22, 33, 43, 0.12);
      }

      .mark {
        display: grid;
        width: 44px;
        height: 44px;
        margin-bottom: 18px;
        place-items: center;
        border-radius: 6px;
        color: #ffffff;
        background: #b3261e;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #51606c;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">AR</div>
      <h1>Manual assistant offline</h1>
      <p>
        This device cannot reach the Service Assist app right now. Reconnect to the gateway
        network, then reopen the QR link to load the latest manual, telemetry, and assistant session.
      </p>
    </main>
  </body>
</html>
